<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>專案成果提交</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px 15px;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
        }
        td {
            padding: 8px 4px;
            vertical-align: middle;
        }
        .label-col {
            width: 24%;
            font-weight: bold;
            color: #333;
            text-align: right;
        }
        input[type="text"], 
        input[type="url"], 
        select, 
        textarea {
            width: 95%;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-row {
            text-align: center;
            padding-top: 18px;
        }
        input[type="submit"], input[type="reset"] {
            padding: 9px 22px;
            margin: 0 8px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #2980b9;
            color: white;
            border: none;
        }
        input[type="submit"]:hover {
            background-color: #1f6391;
        }
        input[type="reset"] {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>專案階段成果提交</h2>

        <form action="#" method="post" enctype="multipart/form-data">
            <table>
                <tr>
                    <td class="label-col"><label for="project_name">專案名稱：</label></td>
                    <td>
                        <input type="text" id="project_name" name="project_name" placeholder="請輸入專案名稱" required>
                    </td>
                </tr>
                <tr>
                    <td class="label-col"><label for="author">提 送 人：</label></td>
                    <td>
                        <input type="text" id="author" name="author" placeholder="請輸入姓名或稱呼" required>
                    </td>
                </tr>
                <tr>
                    <td class="label-col"><label for="milestone">階段進度：</label></td>
                    <td>
                        <select id="milestone" name="milestone">
                            <option value="phase1">第一階段成果</option>
                            <option value="midterm" selected>期中階段成果 (Milestone)</option>
                            <option value="prototype">原型測試版本 (Prototype)</option>
                            <option value="final">最終驗收交付</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label-col"><label for="demo_url">成果連結：</label></td>
                    <td>
                        <input type="url" id="demo_url" name="demo_url" placeholder="https:// (Demo 網址 / GitHub / 雲端連結)">
                    </td>
                </tr>
                <tr>
                    <td class="label-col"><label for="file_upload">成果附件：</label></td>
                    <td>
                        <input type="file" id="file_upload" name="file_upload">
                    </td>
                </tr>
                <tr>
                    <td class="label-col" style="vertical-align: top;"><label for="description">成果說明：</label></td>
                    <td>
                        <textarea id="description" name="description" rows="4" placeholder="請條列本次完成之主要項目、功能重點或驗證結果..."></textarea>
                    </td>
                </tr>
                <tr>
                    <td class="label-col" style="vertical-align: top;"><label for="next_step">後續規劃：</label></td>
                    <td>
                        <textarea id="next_step" name="next_step" rows="3" placeholder="下一階段預計進行項目或待確認事項..."></textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="btn-row">
                        <input type="submit" value="確認提交成果">
                        <input type="reset" value="清除重填">
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
